    <script>
      // Gracefully silence iframe WebSocket and benign speech rejections
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = String(event.reason || '');
        if (reasonStr.includes('WebSocket') || reasonStr.includes('not-allowed') || reasonStr.includes('Permission denied')) {
          event.preventDefault();
        }
      });
    </script>
